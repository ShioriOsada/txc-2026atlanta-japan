.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.30);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero-badge {
  display: inline-block;
  border: 1.5px solid rgba(255,255,255,0.55);
  color: #fff;
  font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  padding: 4px 16px; border-radius: 20px;
  margin-bottom: 16px; background: rgba(255,255,255,0.12);
  text-decoration: none;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.hero-badge:hover {
  background: rgba(255,255,255,0.22);
  border-color: rgba(255,255,255,0.85);
}
.hero h1 {
  font-size: clamp(24px, 4vw, 42px);
  font-weight: 900; line-height: 1.15; letter-spacing: -.02em;
  color: #fff;
}
.hero h1 span { color: #93c5fd; }
.hero-sub { margin-top: 10px; color: rgba(255,255,255,0.75); font-size: 14px; }
.hero-hint {
  margin-top: 14px;
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.30);
  border-radius: 20px; padding: 8px 20px;
  font-size: 15px; font-weight: 600; color: #fff;
  box-shadow: var(--shadow);
}

/* ─── STATS ─── */
.stats-bar {
  display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;
  padding: 22px 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(37,99,235,.06);
  margin-bottom: 0;
}
.stat { text-align: center; }
.stat-num { font-size: 30px; font-weight: 900; color: var(--accent); line-height: 1; }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }

/* ─── TABS ─── */
.tabs-wrap {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  display: flex;
  gap: 0;
  padding: 0 20px;
  max-width: 100%;
  overflow-x: auto;
}
.tab-btn {
  padding: 14px 28px;
  font-size: 14px; font-weight: 700;
  color: var(--muted);
  border: none; background: none;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: color .18s, border-color .18s;
  letter-spacing: .02em;
}
.tab-btn:hover { color: var(--accent); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── TAB PANELS ─── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ─── CONTROLS ─── */
.controls {
  max-width: 1100px; margin: 24px auto 16px; padding: 0 20px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
}
.search-wrap { flex: 1; min-width: 200px; position: relative; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--muted); pointer-events: none; }
.search-wrap input {
  width: 100%; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 14px; padding: 10px 12px 10px 38px;
  outline: none; transition: border-color .2s, box-shadow .2s;
  box-shadow: var(--shadow);
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.search-wrap input::placeholder { color: #a0aec0; }

/* ─── GRID ─── */
.grid-section { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
.company-section { margin-bottom: 36px; }
.company-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.company-label {
  font-size: 13px; font-weight: 800;
  color: var(--surface);
  padding: 4px 14px; border-radius: 20px;
  background: var(--tc, #2563eb);
}
.company-count { font-size: 12px; color: var(--muted); font-weight: 600; }
.cards-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

/* ─── MEMBER CARD ─── */
.member-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 22px 18px 18px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  position: relative;
  overflow: hidden;
  transition: box-shadow .2s, transform .15s, border-color .2s;
}
.member-card.clickable {
  cursor: pointer;
}
.member-card.clickable:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-3px);
  border-color: var(--tc, #2563eb);
}
.member-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: var(--tc, #2563eb);
}
.card-avatar {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--tbg, #dbeafe);
  border: 2.5px solid var(--tc, #2563eb);
  color: var(--tc, #2563eb);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 900;
  transition: transform .2s;
}
.member-card.clickable:hover .card-avatar { transform: scale(1.08); }
.card-name {
  font-size: 15px; font-weight: 800; text-align: center;
  line-height: 1.3; color: var(--text);
}
.card-company {
  font-size: 10px; color: var(--muted); text-align: center;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  max-width: 100%;
}
.card-hint {
  font-size: 10px; color: var(--tc, #2563eb);
  font-weight: 700; letter-spacing: .05em; opacity: .7;
}

/* ─── EMPTY STATE ─── */
.empty-state { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; display: none; }

/* ─── MODAL ─── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15,30,80,.5);
  backdrop-filter: blur(6px);
  z-index: 200;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-card {
  background: #ffffff;
  border-radius: 28px;
  max-width: 580px; width: 100%;
  overflow: hidden;
  box-shadow: 0 32px 100px rgba(0,0,0,.25);
  animation: cardPop .28s cubic-bezier(.34,1.56,.64,1);
  position: relative;
}
@keyframes cardPop {
  from { transform: scale(.82) translateY(28px); opacity: 0; }
  to   { transform: scale(1)   translateY(0);    opacity: 1; }
}
.modal-header {
  padding: 28px 28px 22px;
  position: relative; overflow: hidden;
  border-bottom: 2px solid var(--mborder, #2563eb22);
}
.modal-header::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--mbg, #dbeafe);
  opacity: .35;
}
.modal-header-inner { position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; }
.modal-avatar {
  width: 70px; height: 70px; border-radius: 50%;
  background: var(--mbg, #dbeafe);
  border: 3px solid var(--mc, #2563eb);
  color: var(--mc, #2563eb);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 900; flex-shrink: 0;
}
.modal-company-badge {
  display: inline-block;
  font-size: 10px; font-weight: 800; letter-spacing: .1em;
  padding: 2px 10px; border-radius: 20px;
  background: var(--mc, #2563eb); color: #fff;
  margin-bottom: 6px; word-break: break-all;
}
.modal-name { font-size: 22px; font-weight: 900; line-height: 1.1; color: var(--text); }
.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: rgba(0,0,0,.08); border: none;
  width: 32px; height: 32px; border-radius: 50%;
  font-size: 16px; cursor: pointer; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, color .2s; z-index: 2;
}
.modal-close:hover { background: rgba(0,0,0,.15); color: var(--text); }
.modal-body { padding: 20px 28px 24px; }
.modal-row { display: flex; gap: 12px; margin-bottom: 14px; align-items: flex-start; }
.modal-row-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
.modal-row-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 3px; }
.modal-row-val { font-size: 13.5px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
.modal-nav { display: flex; gap: 10px; padding: 0 28px 20px; }
.modal-nav-btn {
  flex: 1; background: #f1f5f9; border: 1.5px solid var(--border);
  border-radius: 10px; color: var(--accent); font-size: 13px; font-weight: 700;
  padding: 11px; cursor: pointer; transition: background .18s, border-color .18s;
}
.modal-nav-btn:hover { background: #e2e8f0; border-color: var(--accent); }

/* ─── IBM MEMBERS TAB ─── */
.ibm-section { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
.ibm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}
.ibm-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 24px 16px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
  transition: box-shadow .2s, transform .15s;
}
.ibm-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
.ibm-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 5px;

.ibm-photo {
  width: 72px; height: 72px; border-radius: 50%;
  background: #dbeafe;
  border: 3px solid var(--accent);

  font-size: 26px; font-weight: 900;
  font-style: normal;
}
.ibm-name {
  font-size: 14px; font-weight: 800; text-align: center;
  line-height: 1.3; color: var(--text);
}
.ibm-name-en {
  font-size: 10px; color: var(--muted); text-align: center;
  font-weight: 500;
}
.ibm-dept {
  font-size: 11px; color: var(--accent); font-weight: 700;
  text-align: center;
  background: #eff6ff;
  padding: 3px 10px; border-radius: 12px;
  word-break: break-all;
}

/* ─── SESSIONS TAB ─── */
.sessions-section { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
.session-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, transform .15s;
  border-left: 5px solid var(--tc, #2563eb);
}
.session-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.session-top {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-bottom: 10px;
}
.session-code {
  font-size: 11px; font-weight: 800; letter-spacing: .08em;
  background: var(--tc, #2563eb); color: #fff;
  padding: 2px 10px; border-radius: 12px;
}
.session-type {
  font-size: 11px; font-weight: 600;
  color: var(--muted);
  background: #f1f5f9;
  padding: 2px 10px; border-radius: 12px;
  border: 1px solid var(--border);
}
.session-title {
  font-size: 15px; font-weight: 800; line-height: 1.4;
  color: var(--text); margin-bottom: 8px;
}
.session-title a { color: var(--accent); text-decoration: none; }
.session-title a:hover { text-decoration: underline; }
.session-meta {
  display: flex; flex-wrap: wrap; gap: 12px;
  font-size: 12px; color: var(--muted); margin-bottom: 10px;
}
.session-meta-item { display: flex; gap: 4px; align-items: center; }
.session-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.session-tag {
  font-size: 11px; font-weight: 600;
  padding: 2px 10px; border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--muted); background: #f8fafc;
}
.session-speakers {
  margin-top: 10px;
  display: flex; flex-wrap: wrap; gap: 8px;
}
.speaker-chip {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: var(--text);
  background: #f1f5f9;
  padding: 4px 10px 4px 6px; border-radius: 20px;
  border: 1px solid var(--border);
}
.speaker-chip-av {
  width: 22px; height: 22px; border-radius: 50%;
  background: #dbeafe; color: var(--accent);
  font-size: 11px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ─── COLOR PALETTE (10 colors) ─── */
.c0  { --tc:#2563eb; --tbg:#dbeafe; }
.c1  { --tc:#7c3aed; --tbg:#ede9fe; }
.c2  { --tc:#0891b2; --tbg:#cffafe; }
.c3  { --tc:#059669; --tbg:#d1fae5; }
.c4  { --tc:#d97706; --tbg:#fef3c7; }
.c5  { --tc:#dc2626; --tbg:#fee2e2; }
.c6  { --tc:#db2777; --tbg:#fce7f3; }
.c7  { --tc:#0d9488; --tbg:#ccfbf1; }
.c8  { --tc:#6d28d9; --tbg:#ede9fe; }
.c9  { --tc:#ea580c; --tbg:#ffedd5; }

/* ─── IBM PHOTO ─── */
.ibm-photo img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;
  display: block;
}

/* session type colors */
.st-tec { --tc:#2563eb; }
.st-tlk { --tc:#d97706; }

footer {
  text-align: center; font-size: 12px; color: var(--muted);
  padding: 24px; border-top: 1px solid var(--border);
  background: var(--surface);
}
</style>

  {tc:"#0891b2",tbg:"#cffafe",cls:"c2"},

];
const companyColorMap = {};
let colorCounter = 0;
function getColor(company) {
  if (companyColorMap[company] === undefined) {
    companyColorMap[company] = colorCounter % PALETTE.length;
    colorCounter++;
  }
  return PALETTE[companyColorMap[company]];
}
// pre-assign colors in company order
const allCompanies = [...new Set(MEMBERS.map(m => m.company))];
allCompanies.forEach(c => getColor(c));

function initials(name) {
  const s = name.replace(/[\s\u3000]+/g,'');
  return s[0] ? s[0].toUpperCase() : '?';
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  // hero hint visibility
  document.getElementById('heroHint').style.display = name === 'participants' ? '' : 'none';
}

/* ══════════════════════════════════════
   TAB 1: 参加者一覧
══════════════════════════════════════ */
let filteredList = [];
let modalIdx = 0;

function renderParticipants() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const row = document.getElementById('participantsGrid');
  const empty = document.getElementById('emptyState');
  row.innerHTML = '';
  filteredList = [];

  const visible = MEMBERS.filter(m => {
    if (!q) return true;
    return (m.name + m.company).toLowerCase().includes(q);
  });
  filteredList = visible;

  if (visible.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // flat grid container
  const grid = document.createElement('div');
  grid.className = 'cards-row';

  visible.forEach((m, i) => {
    const color = getColor(m.company);
    const hasComment = m.comment && m.comment.trim();
    const card = document.createElement('div');
    card.className = `member-card ${color.cls}${hasComment ? ' clickable' : ''}`;
    if (hasComment) card.onclick = () => openModal(i);
    card.innerHTML = `
      <div class="card-avatar ${color.cls}">${initials(m.name)}</div>
      <div class="card-name">${m.name}</div>
      <div class="card-company">${m.company}</div>
      ${hasComment ? '<div class="card-hint">クリックで一言 ▶</div>' : ''}
    `;
    grid.appendChild(card);
  });

  row.appendChild(grid);
}

/* ── MODAL ── */
function openModal(idx) {
  modalIdx = idx;
  renderModal();
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function renderModal() {
  const m = filteredList[modalIdx];
  if (!m) return;
  const color = getColor(m.company);

  const hdr = document.getElementById('modalHeader');
  hdr.style.setProperty('--mbg', color.tbg);
  hdr.style.setProperty('--mc', color.tc);
  hdr.style.borderBottomColor = color.tc + '33';

  const av = document.getElementById('modalAvatar');
  av.textContent = initials(m.name);
  av.style.background = color.tbg;
  av.style.borderColor = color.tc;
  av.style.color = color.tc;

  const badge = document.getElementById('modalCompany');
  badge.textContent = m.company;
  badge.style.background = color.tc;

  document.getElementById('modalName').textContent = m.name;
  document.getElementById('modalComment').textContent = m.comment || '（コメントなし）';
  document.getElementById('modalComment').style.color = m.comment ? '' : '#a0aec0';
}
function navModal(dir) {
  // navigate only among clickable members
  const clickable = filteredList.filter(m => m.comment && m.comment.trim());
  const current = filteredList[modalIdx];
  let ci = clickable.indexOf(current);
  ci = (ci + dir + clickable.length) % clickable.length;
  modalIdx = filteredList.indexOf(clickable[ci]);
  renderModal();
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function overlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('modalOverlay').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft')  navModal(-1);
  if (e.key === 'ArrowRight') navModal(1);
});

/* ══════════════════════════════════════
   TAB 2: IBM 参加者
══════════════════════════════════════ */
function renderIBM() {
  const grid = document.getElementById('ibmGrid');
  grid.innerHTML = IBM_MEMBERS.map(m => {
    const ini = m.nameJa ? m.nameJa.replace(/[\s\u3000]+/g,'')[0] : m.nameEn[0].toUpperCase();
    const photoContent = m.photo
      ? `<img src="${m.photo}" alt="${m.nameJa || m.nameEn}" onerror="this.style.display='none';this.parentNode.textContent='${ini}'">`
      : ini;
    return `<div class="ibm-card">
      <div class="ibm-photo">${photoContent}</div>
      <div class="ibm-name">${m.nameJa || m.nameEn}</div>
      ${m.nameJa ? `<div class="ibm-name-en">${m.nameEn}</div>` : ''}
      <div class="ibm-dept">${m.dept}</div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════
   TAB 3: セッション
══════════════════════════════════════ */
function sessionTypeColor(type) {
  if (type.startsWith('Technology')) return {tc:'#2563eb'};
  if (type.startsWith('Hands'))      return {tc:'#059669'};
  if (type.startsWith('Tech Talk'))  return {tc:'#d97706'};
  return {tc:'#64748b'};
}
function sessionTypeClass(type) {
  if (type.startsWith('Technology')) return 'st-tec';
  if (type.startsWith('Hands'))      return 'st-lab';
  if (type.startsWith('Tech Talk'))  return 'st-tlk';
  return '';
}

function renderSessions() {
  const wrap = document.getElementById('sessionsGrid');
  wrap.innerHTML = SESSIONS.map(s => {
    const cls = sessionTypeClass(s.type);
    const speakers = s.speakers.map(sp => `
      <span class="speaker-chip">
        <span class="speaker-chip-av">${sp[0].toUpperCase()}</span>
        ${sp}
      </span>`).join('');
    const tags = s.products.split(',').map(t =>
      `<span class="session-tag">${t.trim()}</span>`).join('');

    return `<div class="session-card ${cls}">
      <div class="session-top">
        <span class="session-code ${cls}">${s.code}</span>
        <span class="session-type">${s.type}</span>
      </div>
      <div class="session-title">
        ${s.link
          ? `<a href="${s.link}" target="_blank" rel="noopener">${s.title}</a>`
          : s.title}
      </div>
      <div class="session-meta">
        ${s.date ? `<span class="session-meta-item">📅 ${s.date}</span>` : ''}
        <span class="session-meta-item">🏢 ${s.company}</span>
        <span class="session-meta-item">🎯 ${s.track}</span>
      </div>
      <div class="session-tags">${tags}</div>
      <div class="session-speakers">${speakers}</div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
renderParticipants();
renderIBM();
renderSessions();
</script>
